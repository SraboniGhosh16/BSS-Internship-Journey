<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Clock UI</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="container">
        <div class="clock">
            <div class="hand minute-hand"></div>
            <div class="hand second-hand"></div>
            <div class="hand hour-hand"></div>
            <div class="center-point"></div>
        </div>
    </main>
    <footer class="footer">
        <p>Simple Clock UI</p>
        <p>
            This is a CSS animation demonstration, not a functional clock.
            It does not display real time and the hand movements are not
            synchronised with standard clock time.
        </p>
    </footer>
</body>
</html>
