<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Lightbox CSS from cdnjs.com -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/lightbox2/2.12.0/css/lightbox.css" integrity="sha512-g9YonN4NvzfrKGXa02pVkXBUW5XGDRCn3fNlsqERPAQkT4ouoyksi4fN7KjBWbhuhftJNIxIvmFDw5GkAx8PzA==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="styles.css">
    <title>Sraboni's Bento Box Image Gallery</title>
</head>
<body>
    <main class="gallery-container">
        <h1>Sraboni's Gallery</h1>
        <div class="gallery">
            <!-- Image 1 -->
            <a href="images/image-1.jpeg"
               data-lightbox="my-gallery"
               data-title="Blue Cloudy Sky">
                <img src="images/image-1.jpeg" alt="Blue Cloudy Sky">
            </a>

            <!-- Image 2 -->
            <a href="images/image-2.jpeg"
               data-lightbox="my-gallery"
               data-title="Beach Sunset">
                <img src="images/image-2.jpeg" alt="Sunset at Beach">
            </a>

            <!-- Image 3 -->
            <a href="images/image-3.jpeg"
               data-lightbox="my-gallery"
               data-title="Sky View">
                <img src="images/image-3.jpeg" alt="Night Sky View">
            </a>

            <!-- Image 4 -->
            <a href="images/image-4.jpeg"
               data-lightbox="my-gallery"
               data-title="Birds Tree">
                <img src="images/image-4.jpeg" alt="Tree full of Birds">
            </a>

            <!-- Image 5 -->
            <a href="images/image-5.jpeg"
               data-lightbox="my-gallery"
               data-title="Dog Smile">
                <img src="images/image-5.jpeg" alt="Dog Smiling">
            </a>

            <!-- Image 6 -->
            <a href="images/image-6.jpeg"
               data-lightbox="my-gallery"
               data-title="Doves">
                <img src="images/image-6.jpeg" alt="Doves eating together">
            </a>

        </div>

    </main>

    <!-- jQuery from cdnjs.com -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/4.0.0/jquery.factory.min.js" integrity="sha512-FloNl5Zo/4cRKy1BbQ44Aq5Nte/AugjSxCxITT+IxiWKVi9V9ZDzeFumLD2nSsWlv2ExKNPAhmtbJ4HF7wR1lA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <!-- Lightbox JavaScript from cdnjs.com -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lightbox2/2.12.0/js/lightbox-plus-jquery.min.js" integrity="sha512-Tj1sQm5hfyIf3D75HdMher+Csikwksu8VZHZqexrXhYo5m6l2W/C0P+cLqsgmUhifspT5Yq/y+4WsCCo8Dy8QA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

</body>
</html>
